projects:
    - name: DeepSpeed
      full_name: Deep learning optimization library
      url: https://github.com/deepspeedai/DeepSpeed
      description:
        items:
          - DeepSpeed is an optimization library for deep-learning training and inference with <strong>38k&nbsp;GitHub&nbsp;stars</strong> and <strong>16M+ downloads</strong>. I serve on the <a href="https://github.com/deepspeedai/DeepSpeed/blob/master/COMMITTERS.md">Technical Steering Committee</a> and developed the following key components.
          - <strong>DeepCompile</strong> – compiler-level optimization for distributed training; yields <strong>1.5×</strong> throughput (up to <strong>7×</strong> in memory-limited scenarios) without code changes. (<a href="https://github.com/deepspeedai/DeepSpeed/blob/master/blogs/deepcompile/README.md">Blog</a>, <a href="https://arxiv.org/abs/2504.09983">Paper</a>)
          - <strong>DeepSpeed-FastGen</strong> – high-throughput inference serving with integrated batch scheduling; now adopted by vLLM and other systems. (<a href="https://github.com/deepspeedai/DeepSpeed/blob/master/blogs/deepspeed-fastgen/README.md">Blog</a>, <a href="https://arxiv.org/abs/2401.08671">Paper</a>)
          - <strong>DeepSpeed-Ulysses</strong> – sequence-parallel training achieving <strong>2.5×</strong> speed-up on sequences <strong>4×</strong> longer than previous SOTA. (<a href="https://github.com/deepspeedai/DeepSpeed/blob/master/blogs/deepspeed-ulysses/README.md">Blog</a>, <a href="https://dl.acm.org/doi/pdf/10.1145/3662158.3662806">Paper</a>)
          - <strong>FPDT</strong> (Fully Pipelined Distributed Transformer) – memory-efficient long-sequence training; trains a 7 B-parameter LLM on 2 M-token sequences with just 4 GPUs. (<a href="https://github.com/deepspeedai/DeepSpeed/blob/master/blogs/ulysses-offload/README.md">Blog</a>, <a href="https://openreview.net/forum?id=NHwZ039A90">Paper</a>)
          - <strong>DeepSpeed-Chat</strong> – open-source framework for training large-scale chat models; forked by projects such as OpenRLHF. (<a href="https://github.com/deepspeedai/DeepSpeed/tree/master/blogs/deepspeed-chat">Blog</a>, <a href="https://arxiv.org/abs/2308.01320">Paper</a>)

    - name: Phi-3
      url: https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/
      description:
        items:
          - Phi-3 is a family of small yet highly capable language models designed for on-device and resource-constrained inference.
          - See the blog&nbsp;<a href="https://azure.microsoft.com/en-us/blog/introducing-phi-3-redefining-whats-possible-with-slms/">announcement</a> and technical report&nbsp;<a href="https://arxiv.org/abs/2404.14219">arXiv&nbsp;2404.14219</a> for details.

    - name: MAI-DS-R1
      url: https://techcommunity.microsoft.com/blog/machinelearningblog/introducing-mai-ds-r1/4405076
      description:
        items:
          - MAI-DS-R1 is a Microsoft-fine-tuned version of DeepSeek-R1, enhanced for safety, factuality, and responsiveness on sensitive topics.
          - See the <a href="https://techcommunity.microsoft.com/blog/machinelearningblog/introducing-mai-ds-r1/4405076">Blog post</a> for details.

    - name: RaNNC
      full_name: Rapid Neural Network Connector
      url: https://github.com/nict-wisdom/rannc
      description:
        awards:
          - summary: <font color="red"><strong>Won first place at PyTorch Annual Hackathon 2021</strong></font> (PyTorch Developer Tools & Libraries category) (<font color="red"><strong>1,947 participants from 110 countries</strong></font>, 65 submissions) (<a href="https://pytorch2021.devpost.com/">PyTorch Annual Hackathon 2021</a> <a href="https://devpost.com/software/rannc-rapid-neural-network-connector">Project page</a>, <a href="https://www.nict.go.jp/en/press/2021/12/08-1.html">Press release</a>)
          - summary: <font color="red"><strong>Won first prize at Advanced Technology Award</strong></font> (Minister of Education, Culture, Sports, Science and Technology Award in Business and Industry category) (<a href="http://www.sankei-award.jp/sentan/jusyou/">Winners of the award</a>, the <a href="https://www.sankei.com/article/20220609-GX3QHEI4VRN3ZCJ4GNS2HDIWOM/">announcement of winners</a>, and news articles about  <a href="https://www.sankei.com/article/20220711-5KAPIGBP3BLV7FS7WLY6FXNYLE/">our work</a> and the <a href="https://www.sankei.com/article/20220714-DPGDQEXMKNPFPDIWCV2FOCH7UA/">ceremony</a>. (in Japanese)
        items:
          - RaNNC is a middleware to train very large-scale neural networks and automatically partitions neural networks for the hybrid data/model parallelism.
          - We confirmed that we could train a BERT model with 100 billion parameters without any manual tuning for parallelization.
          - Unlike existing frameworks like Megatron-LM and Mesh-TensorFlow, RaNNC can train models written for PyTorch without any changes for model parallelism.
          - See the <a href="https://github.com/nict-wisdom/rannc">documents</a> and our IPDPS 2021 paper[<a href="https://arxiv.org/abs/2103.16063">preprint</a>] for the details.
          
    - name: RaSC
      full_name: Rapid Service Connector
      url: https://alaginrc.nict.go.jp/rasc/en/index.html"
      description:
        items:
          - RaSC is middleware to easily wrap various command line programs as RPC services.
          - We have used RaSC to orchestrate many NLP tools on hundreds of compute nodes.
          - See our <a href="https://ieeexplore.ieee.org/document/7967199">IPDPS 2017 paper</a> for the details. (The source code available on GitHub is a very old version, which does not offer most of advanced features described in the paper.)
      applications:
        summary: RaSC is used for many large-scale information analysis systems including (all systems are for Japanese language)
        list: 
          - <a href="https://wisdom-nict.jp/">WISDOM X</a> (question answering system using 6 billion Web pages as the knowledge source. Many BERT models are also used inside.)
          - <a href="http://disaana.jp/">DISAANA</a> (disaster information analyzer)
          - <a href="https://disaana.jp/d-summ/">D-SUMM</a> (disaster-information summarizer)
          - WEKDA (WEb-based Knowledge Disseminating dialog Agent)
          - <a href="https://www.youtube.com/watch?v=gCUrC3f9-Go">MICSUS</a> (multimodal interactive care support system)
